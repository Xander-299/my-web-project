spring:
  application:
    name: tlias-admin
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tlias}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小(包括所有文件和表单数据)
      max-request-size: 100MB

#文件上传目录
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

#JWT 配置
jwt:
  # 密钥，生产环境请通过环境变量 JWT_SECRET 注入（至少 32 字节）
  secret: ${JWT_SECRET:myJwtSecretKeyMyJwtSecretKey123456}
  # 过期时间（毫秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400000}

#配置mybatis
mybatis:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true
    mapper-locations: classpath*:com/tlias/mapper/*.xml
#配置日志
logging:
  level:
    root: info
