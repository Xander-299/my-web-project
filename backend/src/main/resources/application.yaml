spring:
  application:
    name: tlias-admin
  datasource:
    url: jdbc:mysql://localhost:3306/tlias?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: REDACTED_LOCAL_PASSWORD
  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小(包括所有文件和表单数据)
      max-request-size: 100MB

#配置mybatis
mybatis:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true
    mapper-locations: classpath*:com/tlias/mapper/*.xml
#配置日志
logging:
  level:
    root: info
