# 本地开发配置模板
#
# 用法：
#   1. 复制本文件为 application-local.yaml（该文件已被 .gitignore 忽略，不会提交）
#   2. 修改下方配置为你的本地真实值
#   3. 启动时激活 local 环境：mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# 也可以完全不用本文件，直接用环境变量：
#   DB_PASSWORD=xxx JWT_SECRET=xxx mvn spring-boot:run

spring:
  datasource:
    # 本地 MySQL 密码
    password: your_local_mysql_password

jwt:
  # 本地开发密钥；生产环境务必用环境变量注入
  secret: local-dev-secret-key-at-least-32-bytes-long
